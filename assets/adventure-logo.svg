<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Mountain Peak -->
    <path d="M100 20 L160 160 H40 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Compass Rose -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    
    <!-- Compass Points -->
    <path d="M100 30 L100 40 M100 160 L100 170 M30 100 L40 100 M160 100 L170 100" 
          stroke="#ffffff" stroke-width="2"/>
    
    <!-- N S E W Labels -->
    <text x="100" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14">N</text>
    <text x="100" y="185" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14">S</text>
    <text x="185" y="104" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14">E</text>
    <text x="15" y="104" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14">W</text>
    
    <!-- Compass Star -->
    <g transform="translate(100 100)">
        <path d="M0 -60 L4 -4 L60 0 L4 4 L0 60 L-4 4 L-60 0 L-4 -4 Z" 
              fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    </g>
</svg> 